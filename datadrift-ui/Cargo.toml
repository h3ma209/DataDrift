[package]
name = "datadrift-ui"
version = "0.3.0"
edition = "2021"
description = "DataDrift — modern DataGrip-style database shell (Dioxus)"

[dependencies]
datadrift = { path = "../datadrift" }
dioxus = { version = "0.6", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = "0.19"
mysql = "23"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scylla = "0.15"
mongodb = "3"
redis = { version = "0.27", default-features = false, features = ["aio", "tokio-comp"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
